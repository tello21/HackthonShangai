# Scoutr palette (from the team's mock-up): ink #162638 · blue #17639c · lime #d9f077
#   background #fbfbf7 · soft #f3f7f7 · fonts Space Grotesk + Inter (loaded in components/style.py)
[theme]
base = "light"
primaryColor = "#17639c"
backgroundColor = "#fbfbf7"
secondaryBackgroundColor = "#f3f7f7"
textColor = "#162638"

[server]
enableStaticServing = true   # product photos in static/images, served at app/static/images/
